<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ליגת העל">
<title>ניחוש תוצאות · ליגת העל</title>
<link rel="manifest" href="data:application/json,{
  &quot;name&quot;: &quot;ניחוש תוצאות ליגת העל&quot;,
  &quot;short_name&quot;: &quot;ליגת העל&quot;,
  &quot;start_url&quot;: &quot;.&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#080810&quot;,
  &quot;theme_color&quot;: &quot;#080810&quot;,
  &quot;icons&quot;: [{&quot;src&quot;: &quot;https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f3c0.png&quot;, &quot;sizes&quot;: &quot;72x72&quot;, &quot;type&quot;: &quot;image/png&quot;}]
}">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #080810; --card: #13132a; --card2: #0f0f22;
    --orange: #ff4500; --gold: #ffd700; --green: #22c55e;
    --blue: #3b82f6; --red: #f87171;
    --text: #fff; --muted: #ffffff55; --border: #ffffff12;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; overflow: hidden; }
  #app { height: 100vh; display: flex; flex-direction: column; position: relative; }

  /* Background */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 40% at 20% 10%, #ff450012, transparent),
                radial-gradient(ellipse 50% 50% at 80% 80%, #ffd70010, transparent);
  }

  /* Header */
  .header {
    position: relative; z-index: 10;
    background: #0d0d1a; border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10; }
  .header-ball { font-size: 28px; }
  .header-title { font-size: 18px; font-weight: 800; }
  .header-sub { font-size: 11px; color: #ffd70099; margin-top: 2px; }
  .notif-btn {
    font-size: 20px; background: #ffffff10; border: 1px solid #ffffff20;
    border-radius: 12px; width: 42px; height: 42px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .notif-btn.on { background: #ffd70022; border-color: #ffd70066; }

  /* Content */
  .content { flex: 1; overflow-y: auto; padding: 14px; position: relative; z-index: 1; padding-bottom: 80px; }

  /* Bottom Nav */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: #0d0d1a; border-top: 1px solid var(--border);
    display: flex; flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 10px 0 14px; border: none; background: transparent;
    color: #ffffff44; cursor: pointer; font-family: inherit;
    position: relative; transition: color 0.2s; font-size: 10px; font-weight: 600;
  }
  .nav-btn.active { color: var(--gold); }
  .nav-icon { font-size: 20px; margin-bottom: 2px; }
  .live-dot {
    position: absolute; top: 8px; right: calc(50% - 12px);
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--orange); box-shadow: 0 0 6px var(--orange);
    animation: blink 1.5s infinite;
  }

  /* Toast */
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 999; padding: 12px 20px; border-radius: 14px;
    font-size: 13px; font-weight: 700; color: #fff;
    box-shadow: 0 4px 24px #00000066; white-space: nowrap;
    animation: slideDown 0.3s ease; pointer-events: none;
  }

  /* Pills */
  .pills { display: flex; gap: 8px; margin-bottom: 14px; }
  .pill {
    flex: 1; padding: 8px 0; border-radius: 12px;
    border: 1px solid var(--border); background: #ffffff08;
    color: #ffffff66; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .pill.active {
    background: linear-gradient(135deg, var(--orange), #ff8c00);
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 20px #ff450044;
  }

  /* Section label */
  .section-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }

  /* Card */
  .card {
    background: linear-gradient(135deg, var(--card), var(--card2));
    border-radius: 18px; border: 1px solid var(--border);
    padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 4px 20px #00000030;
  }
  .card.filled { border-color: #ffd70030; box-shadow: 0 4px 24px #ffd70015; }
  .card.live-card { border-color: #ff450055; box-shadow: 0 0 24px #ff450020; }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #ffffff44; margin-bottom: 12px;
  }
  .round-tag {
    background: #ff450022; color: #ff8c00;
    border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 700;
  }
  .live-chip {
    background: #ff450022; color: var(--orange);
    border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 800;
  }

  /* Teams row */
  .teams-row { display: flex; align-items: center; gap: 8px; }
  .team-col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .team-col.right { align-items: flex-end; }
  .team-col.left { align-items: flex-start; }
  .team-badge {
    width: 42px; height: 42px; border-radius: 12px; border: 2px solid;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .team-name { font-size: 11px; font-weight: 700; color: #ffffffcc; }
  .team-label { font-size: 10px; color: #ffffff33; }

  /* Score inputs */
  .inputs-col { display: flex; align-items: center; gap: 6px; }
  .score-input {
    width: 50px; height: 50px; border-radius: 12px; border: 2px solid #333;
    background: #ffffff08; color: #fff; font-size: 20px; font-weight: 900;
    text-align: center; outline: none; font-family: inherit;
    -moz-appearance: textfield; transition: all 0.2s;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-input:disabled { opacity: 0.5; cursor: not-allowed; }
  .dash { font-size: 16px; color: #ffffff22; }
  .pred-tag {
    margin-top: 10px; font-size: 12px; color: #ffd700aa;
    text-align: center; font-weight: 700;
    padding-top: 8px; border-top: 1px solid #ffffff0f;
  }

  /* Final score */
  .final-score { display: flex; align-items: center; gap: 8px; }
  .final-num { font-size: 28px; font-weight: 900; }

  /* Live score */
  .live-score-box { display: flex; align-items: center; gap: 8px; }
  .live-num { font-size: 30px; font-weight: 900; transition: all 0.3s; }
  .live-num.flash { color: var(--gold); transform: scale(1.2); }

  /* Submit area */
  .submit-area { margin-top: 14px; }
  .prog-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .prog-label { font-size: 12px; color: var(--muted); text-align: center; }
  .prog-track { height: 5px; background: #ffffff10; border-radius: 10px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius: 10px; transition: width 0.3s ease; }
  .submit-btn {
    width: 100%; padding: 15px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, var(--orange), var(--gold));
    color: #000; font-size: 16px; font-weight: 900; cursor: pointer;
    font-family: inherit; box-shadow: 0 8px 32px #ff450044;
    letter-spacing: 0.5px; transition: transform 0.1s;
  }
  .submit-btn:active { transform: scale(0.97); }
  .submitted-banner {
    background: #22c55e18; border: 1px solid #22c55e44;
    border-radius: 14px; padding: 14px 16px;
    font-size: 14px; color: var(--green); font-weight: 600; text-align: center;
    margin-top: 12px;
  }
  .empty { text-align: center; color: #ffffff33; padding: 40px 0; font-size: 15px; }

  /* Stats row */
  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat-box {
    flex: 1; background: var(--card); border-radius: 16px; border: 1px solid;
    padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .stat-val { font-size: 18px; font-weight: 900; }
  .stat-label { font-size: 9px; color: var(--muted); font-weight: 600; text-align: center; }

  /* History */
  .hist-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
  .hist-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; }
  .hist-round { font-size: 14px; font-weight: 700; color: #ffffffcc; }
  .hist-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hist-right { display: flex; align-items: center; gap: 12px; }
  .hist-points { font-size: 18px; font-weight: 900; }
  .hist-details { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .hist-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-radius: 10px; border: 1px solid; background: #ffffff05;
    font-size: 12px;
  }

  /* Leaderboard */
  .leader-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 12px 16px; margin-bottom: 8px;
  }
  .leader-row.me { border-color: #3b82f644; background: #3b82f610; }
  .leader-rank { font-size: 20px; width: 30px; text-align: center; }
  .leader-avatar { font-size: 26px; }
  .leader-info { flex: 1; }
  .leader-name { font-size: 14px; font-weight: 700; }
  .leader-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .leader-points { font-size: 22px; font-weight: 900; display: flex; flex-direction: column; align-items: flex-end; }
  .leader-pts { font-size: 10px; font-weight: 600; color: var(--muted); }

  /* Invite */
  .invite-box {
    margin-top: 18px; background: linear-gradient(135deg, #1a1a3a, var(--card));
    border-radius: 18px; border: 1px solid #3b82f633; padding: 18px 16px; text-align: center;
  }
  .invite-title { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .invite-sub { font-size: 13px; color: #ffffff66; margin-bottom: 14px; }
  .invite-btn {
    padding: 10px 24px; border-radius: 12px;
    border: 1px solid #3b82f666; background: #3b82f622;
    color: var(--blue); font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }

  /* Animations */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes slideDown { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<div id="app">
  <div class="bg-glow"></div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="header-ball">🏀</span>
      <div>
        <div class="header-title">ליגת העל</div>
        <div class="header-sub">ניחוש תוצאות · עונה 2025/26</div>
      </div>
    </div>
    <button class="notif-btn" id="notifBtn" onclick="toggleNotif()">🔕</button>
  </header>

  <!-- Content -->
  <div class="content" id="content"></div>

  <!-- Nav -->
  <nav class="nav">
    <button class="nav-btn active" id="tab-predict" onclick="setTab('predict')">
      <span class="nav-icon">🎯</span>ניחושים
    </button>
    <button class="nav-btn" id="tab-live" onclick="setTab('live')">
      <span class="nav-icon">🔴</span>חי
      <span class="live-dot"></span>
    </button>
    <button class="nav-btn" id="tab-history" onclick="setTab('history')">
      <span class="nav-icon">📊</span>היסטוריה
    </button>
    <button class="nav-btn" id="tab-leaders" onclick="setTab('leaders')">
      <span class="nav-icon">🏆</span>טבלה
    </button>
  </nav>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const TEAMS = [
  { id:1, name:"מכבי תל אביב",     short:"מכבי ת״א",   color:"#FFD700", logo:"🏆" },
  { id:2, name:"הפועל ירושלים",    short:"הפועל י-ם",  color:"#FF4500", logo:"🔥" },
  { id:3, name:"מכבי חיפה",        short:"מכבי חיפה",  color:"#228B22", logo:"⚡" },
  { id:4, name:"אירוני נס ציונה",  short:"נס ציונה",   color:"#1E90FF", logo:"💎" },
  { id:5, name:"הפועל תל אביב",    short:"הפועל ת״א",  color:"#DC143C", logo:"🦅" },
  { id:6, name:"מכבי אשדוד",       short:"מכבי אשדוד", color:"#4169E1", logo:"🌊" },
  { id:7, name:"בני הרצלייה",      short:"הרצלייה",    color:"#FF8C00", logo:"🏀" },
  { id:8, name:"הפועל גליל עליון", short:"גליל עליון", color:"#20B2AA", logo:"🌿" },
];

const GAMES = [
  { id:1, home:1, away:2, date:"15.05", time:"20:00", round:24, status:"upcoming" },
  { id:2, home:3, away:4, date:"15.05", time:"19:00", round:24, status:"live", hs:67, as:61, q:3, clk:"4:22" },
  { id:3, home:5, away:6, date:"16.05", time:"20:30", round:24, status:"upcoming" },
  { id:4, home:7, away:8, date:"16.05", time:"19:30", round:24, status:"finished", hs:88, as:79 },
  { id:5, home:2, away:3, date:"22.05", time:"20:00", round:25, status:"upcoming" },
  { id:6, home:4, away:1, date:"22.05", time:"21:00", round:25, status:"upcoming" },
  { id:7, home:6, away:5, date:"22.05", time:"19:00", round:25, status:"upcoming" },
  { id:8, home:8, away:7, date:"23.05", time:"19:30", round:25, status:"upcoming" },
];

const LEADERBOARD = [
  { name:"יוסי כהן",   points:187, correct:62, avatar:"👑" },
  { name:"דנה לוי",    points:174, correct:58, avatar:"🔥" },
  { name:"מיכאל רוזן", points:161, correct:53, avatar:"⚡" },
  { name:"את/ה",       points:143, correct:47, avatar:"🏀", isMe:true },
  { name:"אורן שמש",   points:138, correct:45, avatar:"🌟" },
  { name:"רוני פרץ",   points:121, correct:40, avatar:"🎯" },
];

const HISTORY = [
  { round:23, date:"08.05", predictions:4, correct:3, points:9, details:[
    { home:1,away:2,ph:92,pa:78,rh:95,ra:80,ok:true },
    { home:3,away:4,ph:70,pa:75,rh:68,ra:81,ok:true },
    { home:5,away:6,ph:85,pa:72,rh:72,ra:85,ok:false },
    { home:7,away:8,ph:88,pa:80,rh:91,ra:77,ok:true },
  ]},
  { round:22, date:"01.05", predictions:4, correct:2, points:6, details:[] },
  { round:21, date:"24.04", predictions:4, correct:4, points:12, details:[] },
  { round:20, date:"17.04", predictions:3, correct:1, points:3, details:[] },
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentTab = "predict";
let activeRound = 24;
let predictions = {};
let submitted = {};
let notifOn = false;
let liveGames = GAMES.map(g => ({...g}));
let expandedRound = null;

// ─── UTILS ───────────────────────────────────────────────────────────────────
const getTeam = id => TEAMS.find(t => t.id === id);
const rounds = [...new Set(GAMES.map(g => g.round))];

function showToast(msg, color = "#22c55e") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = color;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3000);
}

function toggleNotif() {
  notifOn = !notifOn;
  const btn = document.getElementById("notifBtn");
  btn.textContent = notifOn ? "🔔" : "🔕";
  btn.className = "notif-btn" + (notifOn ? " on" : "");
  showToast(notifOn ? "🔔 התראות הופעלו! שעה לפני כל משחק" : "🔕 התראות כובו", notifOn ? "#22c55e" : "#3b82f6");
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  render();
}

function setRound(r) {
  activeRound = r;
  render();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const c = document.getElementById("content");
  if (currentTab === "predict") c.innerHTML = renderPredict();
  else if (currentTab === "live") c.innerHTML = renderLive();
  else if (currentTab === "history") c.innerHTML = renderHistory();
  else if (currentTab === "leaders") c.innerHTML = renderLeaders();
}

// ─── PREDICT ─────────────────────────────────────────────────────────────────
function renderPredict() {
  const roundGames = GAMES.filter(g => g.round === activeRound && g.status !== "live");
  const upcoming = roundGames.filter(g => g.status === "upcoming");
  const finished = roundGames.filter(g => g.status === "finished");
  const isSubmitted = submitted[activeRound];
  const filled = upcoming.filter(g => predictions[g.id]?.h !== undefined && predictions[g.id]?.a !== undefined).length;

  let html = `<div class="pills">`;
  rounds.forEach(r => {
    html += `<button class="pill ${r === activeRound ? "active" : ""}" onclick="setRound(${r})">סיבוב ${r}</button>`;
  });
  html += `</div>`;

  if (upcoming.length > 0) {
    html += `<div class="section-label">משחקים קרובים</div>`;
    upcoming.forEach((g, i) => { html += renderGameCard(g, isSubmitted); });

    if (!isSubmitted) {
      const pct = (filled / upcoming.length * 100).toFixed(0);
      html += `
        <div class="submit-area">
          <div class="prog-row">
            <div class="prog-label">${filled}/${upcoming.length} מולאו</div>
            <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
          </div>
          <button class="submit-btn" onclick="submitPredictions()">שלח ניחושים 🎯</button>
        </div>`;
    } else {
      html += `<div class="submitted-banner">✅ ניחושים נשלחו לסיבוב ${activeRound}! תוצאות יעודכנו לאחר המשחקים.</div>`;
    }
  }

  if (finished.length > 0) {
    html += `<div class="section-label" style="margin-top:20px">משחקים שהסתיימו</div>`;
    finished.forEach(g => { html += renderFinishedCard(g); });
  }

  if (upcoming.length === 0 && finished.length === 0) {
    html += `<div class="empty">אין משחקים לסיבוב זה</div>`;
  }

  return html;
}

function renderGameCard(g, locked) {
  const home = getTeam(g.home), away = getTeam(g.away);
  const pred = predictions[g.id] || {};
  const hasPred = pred.h !== undefined && pred.a !== undefined;
  let winner = "";
  if (hasPred) {
    if (pred.h > pred.a) winner = `✓ ${home.short} מנצחת`;
    else if (pred.a > pred.h) winner = `✓ ${away.short} מנצחת`;
    else winner = "✓ תיקו";
  }
  return `
    <div class="card ${hasPred ? "filled" : ""}">
      <div class="card-meta">
        <span>📅 ${g.date}</span>
        <span class="round-tag">סיבוב ${g.round}</span>
        <span>🕗 ${g.time}</span>
      </div>
      <div class="teams-row">
        ${teamCol(home, "בית", "right")}
        <div class="inputs-col">
          <input type="number" class="score-input" id="g${g.id}h"
            min="0" max="200" placeholder="—"
            value="${pred.h !== undefined ? pred.h : ""}"
            style="border-color:${pred.h !== undefined ? home.color : "#333"};${pred.h !== undefined ? `box-shadow:0 0 14px ${home.color}55` : ""}"
            ${locked ? "disabled" : ""}
            oninput="updatePred(${g.id},'h',this.value)"
            onchange="updatePred(${g.id},'h',this.value)">
          <span class="dash">—</span>
          <input type="number" class="score-input" id="g${g.id}a"
            min="0" max="200" placeholder="—"
            value="${pred.a !== undefined ? pred.a : ""}"
            style="border-color:${pred.a !== undefined ? away.color : "#333"};${pred.a !== undefined ? `box-shadow:0 0 14px ${away.color}55` : ""}"
            ${locked ? "disabled" : ""}
            oninput="updatePred(${g.id},'a',this.value)"
            onchange="updatePred(${g.id},'a',this.value)">
        </div>
        ${teamCol(away, "חוץ", "left")}
      </div>
      ${hasPred ? `<div class="pred-tag">${winner}</div>` : ""}
    </div>`;
}

function renderFinishedCard(g) {
  const home = getTeam(g.home), away = getTeam(g.away);
  const pred = predictions[g.id];
  let predHtml = "";
  if (pred) {
    const ok = (pred.h > pred.a) === (g.hs > g.as);
    predHtml = `<div class="pred-tag" style="color:${ok ? "#22c55e" : "#f87171"}">${ok ? `✅ ניחשת נכון!` : `❌ ניחשת: ${pred.h}—${pred.a}`}</div>`;
  }
  return `
    <div class="card" style="opacity:0.85">
      <div class="card-meta">
        <span>📅 ${g.date}</span>
        <span style="background:#ffffff15;color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700">הסתיים</span>
      </div>
      <div class="teams-row">
        ${teamCol(home, "בית", "right")}
        <div class="final-score">
          <span class="final-num">${g.hs}</span>
          <span class="dash">—</span>
          <span class="final-num">${g.as}</span>
        </div>
        ${teamCol(away, "חוץ", "left")}
      </div>
      ${predHtml}
    </div>`;
}

function updatePred(gameId, side, val) {
  if (!predictions[gameId]) predictions[gameId] = {};
  predictions[gameId][side] = val === "" ? undefined : parseInt(val);
  // Update input styles
  const g = GAMES.find(x => x.id === gameId);
  const team = side === "h" ? getTeam(g.home) : getTeam(g.away);
  const inp = document.getElementById(`g${gameId}${side}`);
  if (inp && val !== "") {
    inp.style.borderColor = team.color;
    inp.style.boxShadow = `0 0 14px ${team.color}55`;
  } else if (inp) {
    inp.style.borderColor = "#333";
    inp.style.boxShadow = "none";
  }
  // Update pred tag
  const pred = predictions[gameId];
  if (pred.h !== undefined && pred.a !== undefined) {
    const home = getTeam(g.home), away = getTeam(g.away);
    let winner = pred.h > pred.a ? `✓ ${home.short} מנצחת` : pred.a > pred.h ? `✓ ${away.short} מנצחת` : "✓ תיקו";
    // Update progress
    const upcoming = GAMES.filter(x => x.round === activeRound && x.status === "upcoming");
    const filled = upcoming.filter(x => predictions[x.id]?.h !== undefined && predictions[x.id]?.a !== undefined).length;
    const progFill = document.querySelector(".prog-fill");
    const progLabel = document.querySelector(".prog-label");
    if (progFill) progFill.style.width = `${(filled / upcoming.length * 100)}%`;
    if (progLabel) progLabel.textContent = `${filled}/${upcoming.length} מולאו`;
  }
}

function submitPredictions() {
  const upcoming = GAMES.filter(g => g.round === activeRound && g.status === "upcoming");
  const filled = upcoming.filter(g => predictions[g.id]?.h !== undefined && predictions[g.id]?.a !== undefined);
  if (filled.length < upcoming.length) {
    showToast("⚠️ מלא ניחוש לכל המשחקים", "#f59e0b");
    return;
  }
  submitted[activeRound] = true;
  showToast("✅ הניחושים נשלחו! בהצלחה!");
  render();
}

// ─── LIVE ────────────────────────────────────────────────────────────────────
function renderLive() {
  const live = liveGames.filter(g => g.status === "live");
  const upcomingToday = liveGames.filter(g => g.status === "upcoming" && g.date === "15.05");
  let html = "";

  if (live.length > 0) {
    html += `<div class="section-label"><span style="animation:blink 1.5s infinite;display:inline-block">🔴</span> משחקים חיים עכשיו</div>`;
    live.forEach(g => {
      const home = getTeam(g.home), away = getTeam(g.away);
      html += `
        <div class="card live-card">
          <div class="card-meta">
            <span class="live-chip">🔴 חי</span>
            <span style="color:#ffd700aa;font-size:13px;font-weight:700">רבע ${g.q} · ${g.clk}</span>
          </div>
          <div class="teams-row">
            ${teamCol(home, "בית", "right")}
            <div class="live-score-box">
              <span class="live-num" id="live-hs-${g.id}">${g.hs}</span>
              <span class="dash">—</span>
              <span class="live-num" id="live-as-${g.id}">${g.as}</span>
            </div>
            ${teamCol(away, "חוץ", "left")}
          </div>
        </div>`;
    });
  }

  if (upcomingToday.length > 0) {
    html += `<div class="section-label" style="margin-top:18px">🕗 הערב</div>`;
    upcomingToday.forEach(g => {
      const home = getTeam(g.home), away = getTeam(g.away);
      html += `
        <div class="card" style="opacity:0.7">
          <div class="teams-row">
            ${teamCol(home, "בית", "right")}
            <div style="text-align:center">
              <div style="font-size:20px;font-weight:900;color:#ffffff44">vs</div>
              <div style="font-size:13px;color:#ffd700bb;margin-top:4px">${g.time}</div>
            </div>
            ${teamCol(away, "חוץ", "left")}
          </div>
        </div>`;
    });
  }

  if (live.length === 0 && upcomingToday.length === 0) {
    html += `<div class="empty">אין משחקים חיים כרגע</div>`;
  }

  return html;
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
function renderHistory() {
  const total = HISTORY.reduce((a, h) => a + h.points, 0);
  const totalCorrect = HISTORY.reduce((a, h) => a + h.correct, 0);
  const totalPred = HISTORY.reduce((a, h) => a + h.predictions, 0);
  const pct = Math.round(totalCorrect / totalPred * 100);

  let html = `
    <div class="stats-row">
      <div class="stat-box" style="border-color:#ffd70044">
        <span style="font-size:22px">🏅</span>
        <div class="stat-val" style="color:#ffd700">${total}</div>
        <div class="stat-label">סה״כ נקודות</div>
      </div>
      <div class="stat-box" style="border-color:#22c55e44">
        <span style="font-size:22px">🎯</span>
        <div class="stat-val" style="color:#22c55e">${pct}%</div>
        <div class="stat-label">אחוז הצלחה</div>
      </div>
      <div class="stat-box" style="border-color:#3b82f644">
        <span style="font-size:22px">✅</span>
        <div class="stat-val" style="color:#3b82f6">${totalCorrect}/${totalPred}</div>
        <div class="stat-label">ניחושים נכונים</div>
      </div>
    </div>
    <div class="section-label">סיבובים אחרונים</div>`;

  HISTORY.forEach(h => {
    const isExp = expandedRound === h.round;
    const pointColor = h.points >= 9 ? "#22c55e" : h.points >= 6 ? "#ffd700" : "#f87171";
    let detailsHtml = "";
    if (isExp && h.details.length > 0) {
      h.details.forEach(d => {
        const home = getTeam(d.home), away = getTeam(d.away);
        detailsHtml += `
          <div class="hist-row" style="border-color:${d.ok ? "#22c55e33" : "#f8717133"}">
            <span style="color:#ffffffcc">${home.short} ${d.rh}—${d.ra} ${away.short}</span>
            <span style="color:${d.ok ? "#22c55e" : "#f87171"}">${d.ok ? `✅ ${d.ph}—${d.pa}` : `❌ ${d.ph}—${d.pa}`}</span>
          </div>`;
      });
    }
    html += `
      <div class="hist-card">
        <div class="hist-header" onclick="toggleHistory(${h.round})">
          <div>
            <div class="hist-round">סיבוב ${h.round} · ${h.date}</div>
            <div class="hist-sub">${h.correct}/${h.predictions} נכון</div>
          </div>
          <div class="hist-right">
            <span class="hist-points" style="color:${pointColor}">+${h.points} נק'</span>
            <span style="color:#ffffff44;font-size:16px">${isExp ? "▲" : "▼"}</span>
          </div>
        </div>
        ${isExp && h.details.length > 0 ? `<div class="hist-details">${detailsHtml}</div>` : ""}
      </div>`;
  });

  return html;
}

function toggleHistory(round) {
  expandedRound = expandedRound === round ? null : round;
  render();
}

// ─── LEADERS ─────────────────────────────────────────────────────────────────
function renderLeaders() {
  let html = `<div class="section-label">🏆 לוח מובילים — חברים</div>`;
  const medals = ["🥇", "🥈", "🥉"];
  LEADERBOARD.forEach((u, i) => {
    const rank = i < 3 ? medals[i] : `#${i + 1}`;
    const ptColor = i === 0 ? "#ffd700" : u.isMe ? "#3b82f6" : "#ffffffcc";
    html += `
      <div class="leader-row ${u.isMe ? "me" : ""}">
        <div class="leader-rank">${rank}</div>
        <div class="leader-avatar">${u.avatar}</div>
        <div class="leader-info">
          <div class="leader-name">${u.name}${u.isMe ? " (אני)" : ""}</div>
          <div class="leader-sub">${u.correct} ניחושים נכונים</div>
        </div>
        <div class="leader-points" style="color:${ptColor}">
          ${u.points}
          <span class="leader-pts">נק'</span>
        </div>
      </div>`;
  });

  html += `
    <div class="invite-box">
      <div class="invite-title">📨 הזמן חברים</div>
      <div class="invite-sub">שתף את הקישור ותתחרה עם חברים!</div>
      <button class="invite-btn" onclick="copyLink()">📋 העתק קישור</button>
    </div>`;

  return html;
}

function copyLink() {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(window.location.href);
    showToast("📋 הקישור הועתק!", "#3b82f6");
  } else {
    showToast("🔗 ligathal.netlify.app", "#3b82f6");
  }
}

// ─── TEAM COL HELPER ─────────────────────────────────────────────────────────
function teamCol(team, label, align) {
  return `
    <div class="team-col ${align}">
      <div class="team-badge" style="background:${team.color}22;border-color:${team.color}88">
        <span>${team.logo}</span>
      </div>
      <span class="team-name">${team.short}</span>
      <span class="team-label">${label}</span>
    </div>`;
}

// ─── LIVE UPDATES ────────────────────────────────────────────────────────────
setInterval(() => {
  liveGames = liveGames.map(g => {
    if (g.status !== "live") return g;
    if (Math.random() > 0.5) return g;
    const side = Math.random() > 0.5 ? "hs" : "as";
    const pts = Math.random() > 0.7 ? 3 : Math.random() > 0.5 ? 2 : 1;
    const updated = { ...g, [side]: g[side] + pts };
    if (currentTab === "live") {
      const el = document.getElementById(`live-${side === "hs" ? "hs" : "as"}-${g.id}`);
      if (el) {
        el.textContent = updated[side];
        el.classList.add("flash");
        setTimeout(() => el && el.classList.remove("flash"), 600);
      }
    }
    return updated;
  });
}, 3000);

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
